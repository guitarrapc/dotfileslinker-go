version: 2
project_name: dotfileslinker

before:
  hooks:
    - go mod tidy

builds:
  - id: dotfileslinker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/dotfileslinker
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    flags:
      - -trimpath

# Archives configuration for GoReleaser v2.8.2
archives:
  - id: dotfileslinker
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    ids:
      - dotfileslinker
    allow_different_binary_count: true
    format_overrides:
      - goos: windows
        formats:
          - zip
      - goos: linux
        formats:
          - tar.gz
      - goos: darwin
        formats:
          - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Generate an artifact-specific SPDX SBOM for every release archive.
# GoReleaser invokes the pinned Syft installed by the release workflow.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    disable: false

# Release configuration - simplified to work with GitHub auto-generated release notes
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto

# Improved reproducibility
gomod:
  proxy: true
  env:
    - GOSUMDB=sum.golang.org
    - GONOSUMDB=github.com/guitarrapc/dotfileslinker-go
